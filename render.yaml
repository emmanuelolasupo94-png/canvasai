services:
  - type: web
    name: canvasai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: IMAGE_MODEL
        value: black-forest-labs/FLUX.1-schnell
      - key: HF_PROVIDER
        value: fal-ai
      - key: PUBLIC_URL
        sync: false
